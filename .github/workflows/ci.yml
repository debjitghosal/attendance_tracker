name: Enterprise CI Pipeline

# This triggers the pipeline whenever you push code to the main branch
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # This runs on a fresh cloud Linux machine provided by GitHub

    steps:
      # Step 1: Download your code onto the GitHub runner
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js to test the backend locally
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # Step 3: Verify the Backend builds and installs correctly
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      # Step 4: The DevOps Test - Verify our Docker infrastructure actually builds!
      - name: Test Docker Compose Build
        run: docker compose build