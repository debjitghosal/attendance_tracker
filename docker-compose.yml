services:
  mongodb:
    image: mongo:6-jammy
    container_name: attendance_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: attendance_backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/attendance
      - PORT=5000
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: attendance_frontend
    ports:
      - "8081:80" # Maps your computer's port 8080 to Nginx's port 80
    depends_on:
      - backend

volumes:
  mongo_data:
